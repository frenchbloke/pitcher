    :root {
      --font-sans: "Inter", "Helvetica Neue", Arial, sans-serif;
    }
    * { box-sizing: border-box; font-family: var(--font-sans) !important; font-weight: 700 !important; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: #111317;
      color: #14171c;
      -webkit-font-smoothing: antialiased;
    }
    ::selection { background: rgba(245,158,11,.3); color: #fef3c7; }
    button, input { font: inherit; }
    .hidden { display: none !important; }

    .page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; }
    @media (min-width: 640px) { .page { padding: 2rem; } }
    .frame { width: 100%; max-width: 56rem; border-radius: .75rem; background: #191C22; padding: .625rem; border: 1px solid #2C313B; box-shadow: 0 24px 60px rgba(0,0,0,.75); }
    @media (min-width: 640px) { .frame { padding: .75rem; } }

    .sl1200-aluminum {
      border-radius: .5rem; border: 1px solid #8E95A0; color: #14171C; overflow: hidden;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.65);
      background-color: #c5cad0;
      background-image:
        repeating-linear-gradient(90deg, rgba(255,255,255,.04) 0px, rgba(255,255,255,.04) 1px, rgba(0,0,0,.025) 1px, rgba(0,0,0,.025) 2px),
        linear-gradient(145deg, #d4d8dd 0%, #c2c7ce 42%, #b7bdc5 72%, #c9ced4 100%);
    }
    .sl1200-key {
      background: linear-gradient(180deg,#e4e7eb 0%,#c8cdd4 48%,#bcc2ca 100%);
      border: 1px solid #6b7280;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.85), inset 0 -1px 0 rgba(0,0,0,.18), 0 2px 3px rgba(0,0,0,.35);
      transition: transform 80ms cubic-bezier(.16,1,.3,1), box-shadow 80ms cubic-bezier(.16,1,.3,1), background 120ms ease;
      cursor: pointer; white-space: nowrap; color: #111317;
    }
    .sl1200-key:hover:not(:disabled) { background: linear-gradient(180deg,#edf0f3 0%,#d1d6dc 48%,#c4cad2 100%); }
    .sl1200-key:active:not(:disabled), .sl1200-key-pressed {
      background: linear-gradient(180deg,#b2b8c0 0%,#c4c9d0 65%,#cdd2d8 100%);
      box-shadow: inset 0 2px 3px rgba(0,0,0,.32), inset 0 -1px 0 rgba(255,255,255,.4), 0 1px 1px rgba(0,0,0,.2);
      transform: translateY(1px);
    }
    .sl1200-key:disabled { opacity: .45; pointer-events: none; }
    .sl1200-key:focus-visible { outline: 2px solid #EE442F; outline-offset: 2px; }

    .sl1200-pitch-slider { -webkit-appearance:none; appearance:none; width:100%; height:44px; background:transparent; cursor:pointer; }
    .sl1200-pitch-slider:focus { outline:none; }
    .sl1200-pitch-slider::-webkit-slider-runnable-track { height:8px; border-radius:1px; background:#090a0d; border-top:1px solid #000; border-bottom:1px solid #2b303a; box-shadow:inset 0 2px 4px rgba(0,0,0,.9); }
    .sl1200-pitch-slider::-webkit-slider-thumb {
      -webkit-appearance:none; appearance:none; width:24px; height:36px; margin-top:-15px; border-radius:2px; border:1px solid #090b0e;
      background:
        linear-gradient(90deg, transparent 44%, #f8fafc 44%, #f8fafc 56%, transparent 56%),
        linear-gradient(180deg, #4a4f59 0%, #2a2e35 16%, #1b1e23 48%, #343942 52%, #1b1e23 84%, #101216 100%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 3px 6px rgba(0,0,0,.75);
      transition: filter 120ms cubic-bezier(.16,1,.3,1);
    }
    .sl1200-pitch-slider:hover::-webkit-slider-thumb { filter: brightness(1.12); }
    .sl1200-pitch-slider:focus-visible::-webkit-slider-thumb { outline:2px solid #ef4444; outline-offset:2px; }
    .sl1200-pitch-slider::-moz-range-track { height:8px; border-radius:1px; background:#090a0d; border-top:1px solid #000; border-bottom:1px solid #2b303a; box-shadow:inset 0 2px 4px rgba(0,0,0,.9); }
    .sl1200-pitch-slider::-moz-range-thumb {
      width:24px; height:36px; border-radius:2px; border:1px solid #090b0e;
      background:
        linear-gradient(90deg, transparent 44%, #f8fafc 44%, #f8fafc 56%, transparent 56%),
        linear-gradient(180deg, #4a4f59 0%, #2a2e35 16%, #1b1e23 48%, #343942 52%, #1b1e23 84%, #101216 100%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 3px 6px rgba(0,0,0,.75);
    }
    .sl1200-pitch-slider:focus-visible::-moz-range-thumb { outline:2px solid #ef4444; outline-offset:2px; }
    .sl1200-pitch-slider:disabled { opacity: .5; }

    .hdr { padding: 1rem 1.5rem; border-bottom: 1px solid #8F96A1; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:1rem; }
    .hdr-left { display:flex; align-items:baseline; gap:.75rem; min-width:0; }
    .title { font-size:1.125rem; font-weight:700; letter-spacing:-.025em; margin:0; color:#111317; white-space:nowrap; }

    .section { padding: 1.5rem; border-bottom: 1px solid #8F96A1; }

      position:relative; height:11rem; width:100%; border-radius:.25rem; background:#111318; border:1px solid #2D323B;

    .grid { display:grid; grid-template-columns:1fr; }
    @media (min-width:768px){ .grid { grid-template-columns:1fr 1fr; } }
    .panel { padding:1.5rem; border-top:1px solid #8F96A1; }
    @media (min-width:768px){ .panel { border-top:0; } .panel + .panel { border-left:1px solid #8F96A1; } }

<body>
  <div class="page">
    <div class="frame">
      <main class="sl1200-aluminum">
        <header class="hdr">
          <div class="hdr-left">

              <span>Decoding audio waveform...</span>
            </div>
            <div id="emptyView" class="center-abs" style="padding:1.5rem;">
              <button id="btnEmptyUpload" type="button" class="sl1200-key upload-btn">
                <span class="icon sm" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#B91C1C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg></span>
                Upload Audio File
              </button>
              <p class="hint">Drop WAV, MP3, FLAC, OGG, or M4A anywhere in this window</p>
            </div>
          </div>

          <div class="stats">
            <div class="mono" style="color:#1F242B;">

            </div>
            <div class="mono" style="display:flex;align-items:center;gap:.75rem;color:#374151;">
              <span>Speed <strong id="rateVal" style="color:#111317;font-weight:700;">1.000x</strong></span>
              <span aria-hidden="true">·</span>
              <span>Shift <strong id="semiVal" style="color:#111317;font-weight:700;">+0.00 st</strong></span>
            </div>
          </div>

        </section>

        <section class="grid">
          <div class="panel panel-left">
            <div>
              <div class="label-row"><span class="label">Set file speed</span></div>
              <div class="rpm-box">
                <button type="button" class="sl1200-key rpm-btn" data-group="source" data-rpm="33"><span class="led on"></span><span class="rpm-num mono">33</span></button>
                <button type="button" class="sl1200-key rpm-btn" data-group="source" data-rpm="45"><span class="led"></span><span class="rpm-num mono">45</span></button>
              </div>
            </div>

              <div class="label-row"><span class="label">Playback speed</span></div>
              <div class="rpm-box">
                <button type="button" class="sl1200-key rpm-btn" data-group="playback" data-rpm="33"><span class="led on"></span><span class="rpm-num mono">33</span></button>
                <button type="button" class="sl1200-key rpm-btn" data-group="playback" data-rpm="45"><span class="led"></span><span class="rpm-num mono">45</span></button>
              </div>

          <div class="panel">

              </div>

            <div class="pitch-face">
              <div class="pitch-row">
                <button id="btnPitchDown" type="button" class="sl1200-key nudge" aria-label="Decrease pitch by 0.1%" title="Decrease 0.1%">
                  <span class="icon sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg></span>
                </button>
                <div class="slider-wrap">
                  <input id="pitchFader" class="sl1200-pitch-slider" type="range" min="-8" max="8" step="0.01" value="0" aria-label="Pitch percentage from -8% to +8%" />
                </div>
                <button id="btnPitchUp" type="button" class="sl1200-key nudge" aria-label="Increase pitch by 0.1%" title="Increase 0.1%">
                  <span class="icon sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></span>

        <footer class="footer">
          <div class="well">
            <button id="btnStart" type="button" class="sl1200-key transport" disabled>
              <span id="startLed" class="s-led" aria-hidden="true"></span>
              <span class="icon sm" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="6,4 20,12 6,20"/></svg></span>
              Start
            </button>

              <span class="icon sm" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="5" y="5" width="14" height="14" rx="1"/></svg></span>
              Stop
            </button>
          </div>
          <div class="well">
            <button id="btnSave" type="button" class="sl1200-key transport" disabled>
              <span class="icon sm" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#B91C1C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg></span>

    </div>
  </div>
  <input id="fileInput" type="file" accept="audio/*" class="hidden" aria-hidden="true" />

  <script>
  (() => {
    "use strict";

    const RPM_EXACT = { 33: 100 / 3, 45: 45 };
    const SCALE_TICKS = [-8, -6, -4, -2, 0, 2, 4, 6, 8];

    function calculatePlaybackRate(sourceRpm, playbackRpm, pitchPercent) {
      return (RPM_EXACT[playbackRpm] / RPM_EXACT[sourceRpm]) * (1 + pitchPercent / 100);
    }
    function calculateSemitones(rate) {
      return rate <= 0 ? 0 : 12 * Math.log2(rate);
    }
    function formatTimecode(seconds) {
      if (!Number.isFinite(seconds) || seconds < 0) return "00:00.0";
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      const tenths = Math.floor((seconds % 1) * 10);
      return String(mins).padStart(2, "0") + ":" + String(secs).padStart(2, "0") + "." + tenths;
    }
    function extractWaveformPeaks(buffer, bucketCount = 480) {
      const mins = new Float32Array(bucketCount);
      const maxs = new Float32Array(bucketCount);
      const totalSamples = buffer.length;
      const numChannels = buffer.numberOfChannels;
      if (totalSamples === 0 || numChannels === 0) return { mins, maxs, bucketCount };
      const channels = [];
      for (let ch = 0; ch < numChannels; ch++) channels.push(buffer.getChannelData(ch));
      const samplesPerBucket = totalSamples / bucketCount;
      for (let b = 0; b < bucketCount; b++) {
        const start = Math.floor(b * samplesPerBucket);
        const end = Math.min(totalSamples, Math.floor((b + 1) * samplesPerBucket));
        const step = Math.max(1, Math.floor((end - start) / 64));
        let minVal = 1, maxVal = -1;
        for (let i = start; i < end; i += step) {
          let sum = 0;
          for (let ch = 0; ch < numChannels; ch++) sum += channels[ch][i];
          const sample = sum / numChannels;
          if (sample < minVal) minVal = sample;
          if (sample > maxVal) maxVal = sample;
        }
        if (minVal > maxVal) { mins[b] = 0; maxs[b] = 0; }
        else { mins[b] = minVal; maxs[b] = maxVal; }
      }
      return { mins, maxs, bucketCount };
    }
    function writeAscii(view, offset, text) {
      for (let i = 0; i < text.length; i++) view.setUint8(offset + i, text.charCodeAt(i));
    }
    function encodeAudioBufferToWav(buffer) {
      const numChannels = buffer.numberOfChannels;
      const sampleRate = buffer.sampleRate;
      const numFrames = buffer.length;
      const bytesPerSample = 2;
      const blockAlign = numChannels * bytesPerSample;
      const byteRate = sampleRate * blockAlign;
      const dataSize = numFrames * blockAlign;
      const arrayBuffer = new ArrayBuffer(44 + dataSize);
      const view = new DataView(arrayBuffer);
      writeAscii(view, 0, "RIFF");
      view.setUint32(4, 36 + dataSize, true);
      writeAscii(view, 8, "WAVE");
      writeAscii(view, 12, "fmt ");
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, numChannels, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, byteRate, true);
      view.setUint16(32, blockAlign, true);
      view.setUint16(34, 16, true);
      writeAscii(view, 36, "data");
      view.setUint32(40, dataSize, true);
      const channelData = [];
      for (let ch = 0; ch < numChannels; ch++) channelData.push(buffer.getChannelData(ch));
      let offset = 44;
      for (let i = 0; i < numFrames; i++) {
        for (let ch = 0; ch < numChannels; ch++) {
          const clamped = Math.max(-1, Math.min(1, channelData[ch][i]));
          const intSample = clamped < 0 ? clamped * 0x8000 : clamped * 0x7fff;
          view.setInt16(offset, intSample, true);
          offset += 2;
        }
      }
      return new Blob([arrayBuffer], { type: "audio/wav" });
    }
    async function renderPitchedWavBlob(sourceBuffer, playbackRate) {
      const safeRate = Math.max(0.1, playbackRate);
      const sampleRate = Math.min(96000, Math.max(8000, sourceBuffer.sampleRate));
      const outDuration = sourceBuffer.duration / safeRate;
      const outLength = Math.max(1, Math.ceil(outDuration * sampleRate));
      const offlineCtx = new OfflineAudioContext(sourceBuffer.numberOfChannels, outLength, sampleRate);
      const source = offlineCtx.createBufferSource();
      source.buffer = sourceBuffer;
      source.playbackRate.value = safeRate;
      source.connect(offlineCtx.destination);
      source.start(0);
      const renderedBuffer = await offlineCtx.startRendering();
      return encodeAudioBufferToWav(renderedBuffer);
    }

    // --- State ---
    let sourceRpm = 33, playbackRpm = 33, pitchPercent = 0;
    let trackMeta = null, peaks = null, audioBuffer = null;
    let isDecoding = false, isExporting = false, isPlaying = false;
    let currentBufferTime = 0;
    let audioCtx = null, sourceNode = null;
    let playbackGen = 0, lastBufferOffset = 0, lastContextTime = 0, lastRate = 1, cuePoint = 0, rafId = null;
    let isScrubbing = false, hoverInfo = null, canvasSize = { width: 800, height: 176 };

    // --- DOM ---
    const $ = (id) => document.getElementById(id);
    const fileInput = $("fileInput");
    const waveWrap = $("waveWrap"), waveCanvas = $("waveCanvas"), hoverTip = $("hoverTip");
    const decodeView = $("decodeView"), emptyView = $("emptyView");
    const trackMetaEl = $("trackMeta"), trackName = $("trackName"), trackRate = $("trackRate"), trackCh = $("trackCh");
    const replaceLabel = $("replaceLabel"), timeCur = $("timeCur"), timeTotal = $("timeTotal");
    const rateVal = $("rateVal"), semiVal = $("semiVal"), errorMsg = $("errorMsg"), rpmInfo = $("rpmInfo");
    const pitchFader = $("pitchFader"), pitchVal = $("pitchVal");
    const btnPitchDown = $("btnPitchDown"), btnPitchUp = $("btnPitchUp");
    const btnStart = $("btnStart"), btnStop = $("btnStop"), btnSave = $("btnSave"), saveLabel = $("saveLabel"), startLed = $("startLed");
    const ticksEl = $("ticks");

    function effectiveRate() { return calculatePlaybackRate(sourceRpm, playbackRpm, pitchPercent); }

    function ensureAudioContext() {
      if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        audioCtx = new Ctx();
      }
      if (audioCtx.state === "suspended") audioCtx.resume();
      return audioCtx;
    }

    function stopSourceNode() {
      playbackGen += 1;
      if (sourceNode) {
        try { sourceNode.onended = null; sourceNode.stop(); sourceNode.disconnect(); } catch (_) {}
        sourceNode = null;
      }
      if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; }
    }

    function getLiveBufferPosition() {
      if (!audioBuffer || !audioCtx || !isPlaying) return lastBufferOffset;
      const elapsedCtx = Math.max(0, audioCtx.currentTime - lastContextTime);
      const pos = lastBufferOffset + elapsedCtx * lastRate;
      return Math.max(0, Math.min(audioBuffer.duration, pos));
    }

    function startPlaybackFrom(startOffset, rate) {
      if (!audioBuffer) return;
      const ctx = ensureAudioContext();
      stopSourceNode();
      const clampedOffset = Math.max(0, Math.min(audioBuffer.duration - 0.001, startOffset));
      const gen = playbackGen;
      const node = ctx.createBufferSource();
      node.buffer = audioBuffer;
      node.playbackRate.value = rate;
      node.connect(ctx.destination);
      lastBufferOffset = clampedOffset;
      lastContextTime = ctx.currentTime;
      lastRate = rate;
      node.onended = () => {
        if (playbackGen !== gen) return;
        sourceNode = null;
        if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; }
        isPlaying = false;
        lastBufferOffset = cuePoint;
        currentBufferTime = cuePoint;
        render();
      };
      node.start(0, clampedOffset);
      sourceNode = node;
      isPlaying = true;
      currentBufferTime = clampedOffset;
      startRaf();
      render();
    }

    function startRaf() {
      if (rafId !== null) return;
      const tick = () => {
        if (!isPlaying) { rafId = null; return; }
        currentBufferTime = getLiveBufferPosition();
        drawWaveform();
        updateTimeStats();
        rafId = requestAnimationFrame(tick);
      };
      rafId = requestAnimationFrame(tick);
    }

    function applyRateChange() {
      const rate = effectiveRate();
      if (!isPlaying || !sourceNode || !audioCtx || !audioBuffer) {
        lastRate = rate;
        return;
      }
      const elapsedCtx = Math.max(0, audioCtx.currentTime - lastContextTime);
      const currentPos = Math.min(audioBuffer.duration, lastBufferOffset + elapsedCtx * lastRate);
      lastBufferOffset = currentPos;
      lastContextTime = audioCtx.currentTime;
      lastRate = rate;
      sourceNode.playbackRate.setValueAtTime(rate, audioCtx.currentTime);
    }

    function setError(msg) {
      if (msg) { errorMsg.textContent = msg; errorMsg.classList.remove("hidden"); }
      else { errorMsg.textContent = ""; errorMsg.classList.add("hidden"); }
    }

    function loadDecodedBuffer(buffer, name) {
      stopSourceNode();
      isPlaying = false;
      audioBuffer = buffer;
      cuePoint = 0; lastBufferOffset = 0; currentBufferTime = 0;
      trackMeta = { name, sampleRate: buffer.sampleRate, channels: buffer.numberOfChannels, duration: buffer.duration };
      peaks = extractWaveformPeaks(buffer, 520);
      setError(null);
      render();
      drawWaveform();
    }

    async function handleFile(file) {
      setError(null);
      isDecoding = true;
      render();
      try {
        const ctx = ensureAudioContext();
        const arrayBuffer = await file.arrayBuffer();
        const decoded = await ctx.decodeAudioData(arrayBuffer);
        loadDecodedBuffer(decoded, file.name);
      } catch (_) {
        setError("Could not decode this audio file. Try a standard WAV, MP3, FLAC, OGG, or M4A file.");
      } finally {
        isDecoding = false;
        render();
      }
    }

    function handleSeek(bufferSeconds) {
      if (!audioBuffer) return;
      const clamped = Math.max(0, Math.min(audioBuffer.duration, bufferSeconds));
      cuePoint = clamped; lastBufferOffset = clamped; currentBufferTime = clamped;
      if (isPlaying) startPlaybackFrom(clamped, effectiveRate());
      else { drawWaveform(); updateTimeStats(); }
    }

    function drawWaveform() {
      if (!peaks) return;
      const dpr = window.devicePixelRatio || 1;
      const { width, height } = canvasSize;
      if (!width || !height) return;
      waveCanvas.width = Math.floor(width * dpr);
      waveCanvas.height = Math.floor(height * dpr);
      const ctx = waveCanvas.getContext("2d");
      if (!ctx) return;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, width, height);

      ctx.strokeStyle = "rgba(255,255,255,0.045)";
      ctx.lineWidth = 1;
      for (let i = 1; i < 8; i++) {
        const gx = Math.round((width * i) / 8) + 0.5;
        ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, height); ctx.stroke();
      }
      const midY = height / 2;
      ctx.strokeStyle = "rgba(255,255,255,0.09)";
      ctx.beginPath(); ctx.moveTo(0, Math.round(midY) + 0.5); ctx.lineTo(width, Math.round(midY) + 0.5); ctx.stroke();

      const duration = trackMeta ? trackMeta.duration : 0;
      const progressRatio = duration > 0 ? Math.max(0, Math.min(1, currentBufferTime / duration)) : 0;
      const playheadX = progressRatio * width;
      const barStep = 3, barWidth = 2;
      const totalBars = Math.max(1, Math.floor(width / barStep));
      const maxAmp = height * 0.43;
      for (let i = 0; i < totalBars; i++) {
        const bucketIdx = Math.min(peaks.bucketCount - 1, Math.floor((i / totalBars) * peaks.bucketCount));
        const minV = peaks.mins[bucketIdx], maxV = peaks.maxs[bucketIdx];
        const x = i * barStep;
        const topY = midY - maxV * maxAmp;
        const bottomY = midY - minV * maxAmp;
        const barH = Math.max(2, bottomY - topY);
        ctx.fillStyle = x <= playheadX ? "#EE442F" : "#646B76";
        ctx.fillRect(x, topY, barWidth, barH);
      }
      if (hoverInfo && !isScrubbing) {
        const hx = Math.round(hoverInfo.x) + 0.5;
        ctx.strokeStyle = "rgba(248,250,252,0.25)";
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(hx, 0); ctx.lineTo(hx, height); ctx.stroke();
      }
      const px = Math.max(1, Math.min(width - 1, Math.round(playheadX))) + 0.5;
      ctx.strokeStyle = isPlaying ? "#FF553D" : "#F3F4F6";
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(px, height); ctx.stroke();
      ctx.fillStyle = isPlaying ? "#FF553D" : "#F3F4F6";
      ctx.beginPath(); ctx.moveTo(px - 5, 0); ctx.lineTo(px + 5, 0); ctx.lineTo(px, 6); ctx.closePath(); ctx.fill();
    }

    function computeRatioFromClientX(clientX) {
      const rect = waveWrap.getBoundingClientRect();
      return rect.width > 0 ? Math.max(0, Math.min(1, (clientX - rect.left) / rect.width)) : 0;
    }

    function updateTimeStats() {
      const rate = effectiveRate();
      const dur = trackMeta ? trackMeta.duration : 0;
      timeCur.textContent = formatTimecode(currentBufferTime / rate);
      timeTotal.textContent = formatTimecode(dur / rate);
      rateVal.textContent = rate.toFixed(3) + "x";
      const semi = calculateSemitones(rate);
      semiVal.textContent = (semi >= 0 ? "+" : "") + semi.toFixed(2) + " st";
    }

    function renderTicks() {
      ticksEl.innerHTML = "";
      SCALE_TICKS.forEach((tick) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "tick-btn";
        btn.title = "Set pitch to " + (tick > 0 ? "+" : "") + tick + "%";
        btn.innerHTML = '<span class="tick-mark"></span><span class="tick-lbl mono"></span>';
        btn.addEventListener("click", () => { pitchPercent = tick; applyRateChange(); render(); });
        ticksEl.appendChild(btn);
      });
      updateTickStyles();
    }

    function updateTickStyles() {
      const buttons = ticksEl.querySelectorAll(".tick-btn");
      buttons.forEach((btn, i) => {
        const tick = SCALE_TICKS[i];
        const isZero = tick === 0;
        const isActive = Math.abs(pitchPercent - tick) < 0.02;
        const mark = btn.querySelector(".tick-mark");
        const lbl = btn.querySelector(".tick-lbl");
        mark.className = "tick-mark" + (isZero ? " zero" : "") + (tick % 4 === 0 && !isZero ? " major" : "");
        lbl.className = "tick-lbl mono" + (isActive ? " active" + (isZero ? " zero" : "") : "");
        lbl.textContent = (tick > 0 ? "+" : "") + tick;
      });
    }

    function updateRpmButtons() {
      document.querySelectorAll(".rpm-btn").forEach((btn) => {
        const group = btn.dataset.group, rpm = Number(btn.dataset.rpm);
        const active = (group === "source" ? sourceRpm : playbackRpm) === rpm;
        btn.classList.toggle("sl1200-key-pressed", active);
        const led = btn.querySelector(".led");
        if (led) led.classList.toggle("on", active);
      });
      const baseRpmRatio = RPM_EXACT[playbackRpm] / RPM_EXACT[sourceRpm];
      const basePercentDelta = (baseRpmRatio - 1) * 100;
      if (sourceRpm === playbackRpm) {
        rpmInfo.textContent = "Matched " + (sourceRpm === 33 ? "33⅓" : "45") + " RPM (1.000x base)";
      } else {
        rpmInfo.textContent = (sourceRpm === 33 ? "33⅓" : "45") + " → " + (playbackRpm === 33 ? "33⅓" : "45") +
          " RPM (" + (basePercentDelta >= 0 ? "+" : "") + basePercentDelta.toFixed(2) + "% base)";
      }
    }

    function render() {
      const hasTrack = !!trackMeta;
      replaceLabel.textContent = hasTrack ? "Replace File" : "Upload Audio";
      trackMetaEl.classList.toggle("show", hasTrack);
      if (hasTrack) {
        trackName.textContent = trackMeta.name;
        trackName.title = trackMeta.name;
        trackRate.textContent = (trackMeta.sampleRate / 1000).toFixed(1) + " kHz";
        trackCh.textContent = trackMeta.channels === 1 ? "Mono" : "Stereo";
      }

      const showDecode = isDecoding;
      const showWave = !isDecoding && !!peaks;
      const showEmpty = !isDecoding && !peaks;
      decodeView.classList.toggle("hidden", !showDecode);
      waveCanvas.classList.toggle("hidden", !showWave);
      emptyView.classList.toggle("hidden", !showEmpty);
      waveWrap.classList.toggle("can-seek", showWave);

      pitchFader.value = String(pitchPercent);
      pitchVal.textContent = (pitchPercent > 0 ? "+" : "") + pitchPercent.toFixed(2) + "%";
      pitchVal.className = "pitch-val mono lock";
      btnPitchDown.disabled = isDecoding || pitchPercent <= -8;
      btnPitchUp.disabled = isDecoding || pitchPercent >= 8;
      updateTickStyles();
      updateRpmButtons();

      btnStart.disabled = !hasTrack || isDecoding;
      btnStop.disabled = !hasTrack || isDecoding;
      btnSave.disabled = !hasTrack || isDecoding || isExporting;
      saveLabel.textContent = isExporting ? "Rendering WAV..." : "Save Audio";
      btnStart.classList.toggle("sl1200-key-pressed", isPlaying);
      startLed.classList.toggle("on", isPlaying);

      updateTimeStats();
      if (showWave) drawWaveform();
      if (!showWave) hoverTip.classList.add("hidden");
    }

    // --- Events ---
    function triggerUpload() { fileInput.click(); }
    $("btnReplace").addEventListener("click", triggerUpload);
    $("btnEmptyUpload").addEventListener("click", triggerUpload);
    fileInput.addEventListener("change", (e) => {
      const file = e.target.files && e.target.files[0];
      if (file) handleFile(file);
      e.target.value = "";
    });

    $("btnDemo").addEventListener("click", () => {
      const ctx = ensureAudioContext();
      loadDecodedBuffer(createDemoVinylBuffer(ctx), "vinyl_sample_loop.wav");
    });

    document.querySelectorAll(".rpm-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        const rpm = Number(btn.dataset.rpm);
        if (btn.dataset.group === "source") sourceRpm = rpm; else playbackRpm = rpm;
        applyRateChange();
        render();
      });
    });

    pitchFader.addEventListener("input", (e) => {
      pitchPercent = parseFloat(e.target.value);
      applyRateChange(); render();
    });
    pitchFader.addEventListener("dblclick", () => { pitchPercent = 0; applyRateChange(); render(); });
    pitchVal.addEventListener("dblclick", () => { pitchPercent = 0; applyRateChange(); render(); });
    btnPitchDown.addEventListener("click", () => {
      pitchPercent = Math.max(-8, Math.min(8, Math.round((pitchPercent - 0.1) * 100) / 100));
      applyRateChange(); render();
    });
    btnPitchUp.addEventListener("click", () => {
      pitchPercent = Math.max(-8, Math.min(8, Math.round((pitchPercent + 0.1) * 100) / 100));
      applyRateChange(); render();
    });

    btnStart.addEventListener("click", () => {
      if (!audioBuffer) return;
      if (isPlaying) { startPlaybackFrom(cuePoint, effectiveRate()); return; }
      const startAt = currentBufferTime >= audioBuffer.duration - 0.02 ? 0 : currentBufferTime;
      startPlaybackFrom(startAt, effectiveRate());
    });
    btnStop.addEventListener("click", () => {
      if (isPlaying) currentBufferTime = getLiveBufferPosition();
      stopSourceNode();
      isPlaying = false;
      lastBufferOffset = currentBufferTime;
      render();
    });
    btnSave.addEventListener("click", async () => {
      if (!audioBuffer || !trackMeta || isExporting) return;
      isExporting = true; setError(null); render();
      try {
        const wavBlob = await renderPitchedWavBlob(audioBuffer, effectiveRate());
        const url = URL.createObjectURL(wavBlob);
        const baseName = trackMeta.name.replace(/\.[^/.]+$/, "");
        const pitchTag = (pitchPercent >= 0 ? "+" : "") + pitchPercent.toFixed(1) + "pct";
        const rpmTag = sourceRpm === playbackRpm ? (playbackRpm + "rpm") : (sourceRpm + "to" + playbackRpm + "rpm");
        const a = document.createElement("a");
        a.href = url; a.download = baseName + "_" + rpmTag + "_" + pitchTag + ".wav";
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (_) {
        setError("Failed to render WAV export. Please try again.");
      } finally {
        isExporting = false; render();
      }
    });

    // Waveform interactions
    waveWrap.addEventListener("dragover", (e) => { e.preventDefault(); waveWrap.classList.add("drag"); });
    waveWrap.addEventListener("dragleave", (e) => { e.preventDefault(); waveWrap.classList.remove("drag"); });
    waveWrap.addEventListener("drop", (e) => {
      e.preventDefault(); waveWrap.classList.remove("drag");
      const file = e.dataTransfer.files && e.dataTransfer.files[0];
      if (file) handleFile(file);
    });
    waveWrap.addEventListener("pointerdown", (e) => {
      if (!peaks || !trackMeta) return;
      waveWrap.setPointerCapture(e.pointerId);
      isScrubbing = true;
      handleSeek(computeRatioFromClientX(e.clientX) * trackMeta.duration);
    });
    waveWrap.addEventListener("pointermove", (e) => {
      if (!peaks || !trackMeta) return;
      const rect = waveWrap.getBoundingClientRect();
      const x = Math.max(0, Math.min(rect.width, e.clientX - rect.left));
      const ratio = rect.width > 0 ? x / rect.width : 0;
      hoverInfo = { x, ratio };
      if (isScrubbing) handleSeek(ratio * trackMeta.duration);
      else {
        hoverTip.style.left = Math.max(36, Math.min(canvasSize.width - 36, x)) + "px";
        hoverTip.textContent = formatTimecode((ratio * trackMeta.duration) / effectiveRate());
        hoverTip.classList.remove("hidden");
        drawWaveform();
      }
    });
    waveWrap.addEventListener("pointerup", (e) => {
      if (isScrubbing) { try { waveWrap.releasePointerCapture(e.pointerId); } catch (_) {} isScrubbing = false; }
    });
    waveWrap.addEventListener("pointerleave", () => {
      hoverInfo = null; isScrubbing = false;
      hoverTip.classList.add("hidden");
      if (peaks) drawWaveform();
    });

    function updateCanvasSize() {
      const rect = waveWrap.getBoundingClientRect();
      if (rect.width > 0 && rect.height > 0) {
        canvasSize = { width: Math.floor(rect.width), height: Math.floor(rect.height) };
        if (peaks) drawWaveform();
      }
    }
    if (typeof ResizeObserver !== "undefined") new ResizeObserver(updateCanvasSize).observe(waveWrap);
    window.addEventListener("resize", updateCanvasSize);

    renderTicks();
    render();
    updateCanvasSize();
  })();
  </script>
</body>
</html>
